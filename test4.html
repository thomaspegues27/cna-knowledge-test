const form = document.getElementById("quizForm");

questions.forEach((item,index)=>{
  const div=document.createElement("div");
  div.className="question";

  let html=`<p>${item.q}</p>`;

  item.o.forEach((choice,i)=>{
    html+=`
    <label>
      <input type="radio"
      name="q${index}"
      value="${i}"
      onchange="updateProgress()">
      ${String.fromCharCode(65+i)}. ${choice}
    </label>`;
  });

  div.innerHTML=html;
  form.appendChild(div);
});

function updateProgress(){
  let answered=0;

  questions.forEach((item,index)=>{
    if(document.querySelector(
      `input[name="q${index}"]:checked`
    )){
      answered++;
    }
  });

  document.getElementById("progressBar").style.width=
  ((answered/questions.length)*100)+"%";
}

function submitTest(){

  let score=0;
  let reviewHTML="";

  questions.forEach((item,index)=>{

    const selected=document.querySelector(
      `input[name="q${index}"]:checked`
    );

    if(!selected){
      reviewHTML+=`
      <div class="incorrect">
      <strong>${item.q}</strong><br>
      Not answered.<br>
      Correct answer:
      ${String.fromCharCode(65+item.a)}.
      ${item.o[item.a]}
      </div>`;
      return;
    }

    const answer=parseInt(selected.value);

    if(answer===item.a){
      score++;
    }else{
      reviewHTML+=`
      <div class="incorrect">
      <strong>${item.q}</strong><br>
      Your answer:
      ${String.fromCharCode(65+answer)}.
      ${item.o[answer]}<br>
      Correct answer:
      ${String.fromCharCode(65+item.a)}.
      ${item.o[item.a]}
      </div>`;
    }

  });

  const percent=((score/70)*100).toFixed(1);
  const passed=score>=52;

  document.getElementById("result").innerHTML=
  `${passed?"✅ PASS":"❌ NOT PASSED"}<br>
  Score: ${score}/70 (${percent}%)<br>
  ${passed
    ?"You passed the 73% requirement."
    :"You need at least 52 correct to pass."}`;

  if(reviewHTML===""){
    reviewHTML=`
    <div class="correct">
    Excellent! You answered every question correctly.
    </div>`;
  }

  document.getElementById("review").innerHTML=
  "<h2>Review Missed Questions</h2>"+reviewHTML;

  document.getElementById("retakeButton").style.display="block";

  document.getElementById("result")
  .scrollIntoView({behavior:"smooth"});
}

function retakeTest(){
  form.reset();
  document.getElementById("result").innerHTML="";
  document.getElementById("review").innerHTML="";
  document.getElementById("retakeButton").style.display="none";
  document.getElementById("progressBar").style.width="0%";
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
