<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNA 70-Question Practice Test</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:18px;background:#f6f7f9;color:#111}
.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}

label{display:block;padding:10px;border:1px solid #ddd;border-radius:10px;margin:7px 0;cursor:pointer}
label:hover{background:#f4f7fb} input{margin-right:9px}

.primary{background:#111;color:#fff} .secondary{background:#e7e9ed}
#result{display:none} .pass{color:#137333} .fail{color:#b3261e}
.correct{border-color:#137333;background:#eaf6ed} .wrong{border-color:#b3261e;background:#fdecec}
.sticky{position:sticky;top:0;background:#f6f7f9;padding:8px 0;z-index:2}
.progress{height:10px;background:#ddd;border-radius:8px;overflow:hidden} .bar{height:100%;background:#111;width:0%}
</style>
</head>
<body>
<div class="sticky">
  <div class="progress"><div id="bar" class="bar"></div></div>
</div>
<div class="card">
<h1>CNA Knowledge Practice Test</h1>
<p class="muted">70 questions • Passing goal: 73% • You can retake this test as often as you want.</p>
<p><b>Directions:</b> Choose one answer for every question, then tap <b>Submit Test</b>.</p>
</div>
<div id="quiz"></div>
<div class="card">
<button class="primary" onclick="grade()">Submit Test</button>
<button class="secondary" onclick="resetQuiz()">Retake Test</button>
</div>
<div id="result" class="card"></div>

as appropriate", "Only with residents known to have an infection", "Only during the night shift", "Only by nurses"], "ans": 0}, {"category": "Infection Control", "q": "When providing female perineal care, the CNA should clean:", "opts": ["Back to front", "Front to back", "In circles only", "In any direction"], "ans": 1}, {"category": "Infection Control", "q": "Disposable gloves should be:", "opts": ["Washed and reused", "Discarded appropriately after use", "Shared with another CNA", "Stored in your pocket for later"], "ans": 1}, {"category": "Infection Control", "q": "While wearing contaminated gloves, the CNA should avoid touching:", "opts": ["Clean equipment and surfaces", "Soiled linen", "Waste bags", "A used bedpan"], "ans": 0}, {"category": "Infection Control", "q": "Proper cough etiquette includes:", "opts": ["Covering coughs/sneezes appropriately and cleaning your hands", "Coughing toward other people", "Reusing dirty tissues", "Skipping hand hygiene"], "ans": 0}, {"category": "Infection Control", "q": "If the CNA's hands are visibly soiled, they should generally use:", "opts": ["Soap and water", "Lotion only", "Gloves only", "A dry paper towel"], "ans": 0}, {"category": "Mental Health", "q": "A resident who is experiencing anxiety should be approached:", "opts": ["Calmly", "Aggressively", "With ridicule", "By arguing with them"], "ans": 0}, {"category": "Mental Health", "q": "When a resident expresses their feelings, the CNA should:", "opts": ["Listen without judging", "Tell everyone what the resident said", "Dismiss the resident's feelings", "Diagnose the resident"], "ans": 0}, {"category": "Mental Health", "q": "A CNA notices a resident showing new or unusual behavior. What should the CNA do?", "opts": ["Observe and report the change", "Punish the resident", "Diagnose the resident with a disorder", "Ignore the behavior"], "ans": 0}, {"category": "Mental Health", "q": "A resident with dementia becomes agitated. What is the best approach?", "opts": ["Use a calm voice and redirect the resident", "Argue with the resident about the facts", "Restrain the resident automatically", "Shout at the resident"], "ans": 0}, {"category": "Personal Care", "q": "During a bed bath, the CNA should:", "opts": ["Keep the resident covered except for the area being washed", "Expose the resident's entire body", "Leave the door open", "Use very hot water"], "ans": 0}, {"category": "Personal Care", "q": "Oral care is important because it helps maintain:", "opts": ["Mouth comfort and cleanliness", "Hearing", "Vision", "Blood pressure"], "ans": 0}, {"category": "Personal Care", "q": "When shaving a resident, the CNA should:", "opts": ["Follow the care plan and safety precautions", "Use another resident's razor", "Rush to finish quickly", "Ignore the resident's bleeding risk"], "ans": 0}, {"category": "Personal Care", "q": "When dressing a resident who has one weak arm, the CNA should generally dress the:", "opts": ["Weak side first", "Strong side first", "Legs only", "Side chosen randomly"], "ans": 0}, {"category": "Personal Care", "q": "When undressing a resident who has one weak arm, the CNA should generally remove the clothing from the:", "opts": ["Strong side first", "Weak side first", "Head first every time", "Both sides at the same time"], "ans": 0}, {"category": "Resident Rights", "q": "A resident has the right to:", "opts": ["Privacy", "Be ignored", "Have their personal information shared publicly", "Be threatened"], "ans": 0}, {"category": "Resident Rights", "q": "Before entering a resident's room, the CNA should usually:", "opts": ["Knock", "Enter silently without warning", "Shout from the hallway", "Wait outside indefinitely"], "ans": 0}, {"category": "Resident Rights", "q": "If a resident refuses care, the CNA should:", "opts": ["Force the resident to accept care", "Respect the refusal and report it", "Threaten the resident", "Hide the refusal from the nurse"], "ans": 1}, {"category": "Resident Rights", "q": "Resident information should be shared:", "opts": ["Only with appropriate care-team members who need the information", "With your friends", "On social media", "In public hallways"], "ans": 0}, {"category": "Resident Rights", "q": "Residents should be allowed to make choices about:", "opts": ["Their care and daily routine when possible", "Other residents' medications", "Staff schedules", "Facility finances"], "ans": 0}, {"category": "Role & Responsibility", "q": "A CNA should perform tasks:", "opts": ["Within their training, job description, and the resident's care plan", "Outside their scope whenever someone asks", "Without reporting anything to the nurse", "Only when convenient"], "ans": 0}, {"category": "Role & Responsibility", "q": "A CNA notices a new skin tear on a resident. What should the CNA do?", "opts": ["Report it to the nurse", "Diagnose the injury", "Prescribe treatment", "Hide it"], "ans": 0}, {"category": "Role & Responsibility", "q": "If a CNA suspects that a resident is being abused, the CNA should:", "opts": ["Report it immediately according to policy and law", "Ignore it unless they personally witnessed it", "Discuss it with other residents", "Keep it secret"], "ans": 0}, {"category": "Role & Responsibility", "q": "If a CNA is asked to perform a task they have not been trained to do, the CNA should:", "opts": ["Seek guidance and stay within their scope of practice", "Do it anyway", "Do it only if the unit is busy", "Do it only during the night shift"], "ans": 0}, {"category": "Role & Responsibility", "q": "Which of the following is part of the CNA's role?", "opts": ["Observe and report", "Diagnose diseases", "Prescribe medications", "Change medical orders"], "ans": 0}, {"category": "Safety", "q": "Before transferring a resident into a wheelchair, the CNA should:", "opts": ["Lock the wheelchair brakes", "Leave the brakes unlocked", "Remove the resident's footwear", "Place the wheelchair far away"], "ans": 0}, {"category": "Safety", "q": "After providing care, the resident' const quiz = document.getElementById('quiz');
questions.forEach((x,i)=>{
  const d=document.createElement('div'); d.className='card';
  d.innerHTML=`<div class="cat">${x.category}</div><h3>${i+1}. ${x.q}</h3>`+
  x.opts.map((o,j)=>`<label id="l-${i}-${j}"><input type="radio" name="q${i}" value="${j}" onchange="updateProgress()"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('');
  quiz.appendChild(d);
});
function updateProgress(){
  let answered=0;
  questions.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`)) answered++;});
  document.getElementById('bar').style.width=(answered/questions.length*100)+'%';
}
function grade(){
  let score=0, unanswered=0, missed=[];
  questions.forEach((x,i)=>{
    const chosen=document.querySelector(`input[name=q${i}]:checked`);
    for(let j=0;j<x.opts.length;j++) document.getElementById(`l-${i}-${j}`).classList.remove('correct','wrong');
    if(!chosen){unanswered++; missed.push(i); return;}
    const v=Number(chosen.value);
    if(v===x.ans){score++; document.getElementById(`l-${i}-${v}`).classList.add('correct');}
    else{document.getElementById(`l-${i}-${v}`).classList.add('wrong'); document.getElementById(`l-${i}-${x.ans}`).classList.add('correct'); missed.push(i);}
  });
  const pct=(score/questions.length*100).toFixed(1), pass=pct>=73;
  const r=document.getElementById('result'); r.style.display='block';
  let msg=`<h2 class="${pass?'pass':'fail'}">${pass?'PASS ✅':'KEEP PRACTICING'} — ${score}/70 (${pct}%)</h2>`;
  if(unanswered) msg+=`<p><b>${unanswered}</b> question(s) were unanswered.</p>`;
  if(missed.length){
    msg+='<h3>Review these questions</h3><ol>';
    missed.forEach(i=>{const x=questions[i]; msg+=`<li><b>${x.q}</b><br>Correct answer: ${String.fromCharCode(65+x.ans)}. ${x.opts[x.ans]}</li><br>`;});
    msg+='</ol>';
  } else msg+='<p>Perfect score. Great job.</p>';
  msg+='<button class="secondary" onclick="resetQuiz()">Retake Test</button>';
  r.innerHTML=msg; r.scrollIntoView({behavior:'smooth'});
}
function resetQuiz(){
  document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);
  document.querySelectorAll('label').forEach(x=>x.classList.remove('correct','wrong'));
  document.getElementById('result').style.display='none';
  document.getElementById('bar').style.width='0%';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
